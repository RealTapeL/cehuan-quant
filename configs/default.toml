[data]
provider = "eastmoney"
daily_endpoint = "stock_zh_a_hist"
adjustment_for_signals = "hfq"
execution_prices = "unadjusted"
timezone = "Asia/Shanghai"
source_note = "AKShare / Eastmoney daily history; close data is expected after 15:00 China time"
max_symbols_per_fetch = 50
request_delay_seconds = 0.25
large_daily_price_change_warning = 0.50
security_identity_events_file = "configs/security_identity_events.csv"
out_date_evidence_file = "docs/evidence/universe-outdate-boundary-audit.csv"

[strategy]
name = "momentum_rank_technical_baseline"
lookback_sessions = 20
rebalance_sessions = 20
max_positions = 5
max_position_weight = 0.20
max_total_exposure = 0.50
min_momentum = 0.0

[market]
# Fallback assumptions are for explicitly labeled research backtests only.
# Live plans require effective-dated per-security trading-rule data.
buy_lot_shares = 100
sell_lot_shares = 100
default_price_limit_pct = 0.10
assume_price_limit_applies_when_unknown = true
price_tick_cny = 0.01
require_point_in_time_status = true
exclude_st = true

[costs]
commission_rate = 0.0003
minimum_commission_cny = 5.0
stamp_duty_sell_rate = 0.0005
transfer_fee_rate = 0.00001
slippage_bps = 5.0

[backtest]
development_fraction = 0.60
validation_fraction = 0.20
rolling_window_sessions = 60
rolling_step_sessions = 20

[plan]
cash_cny = 0.0
cash_note = "Set this to the cash amount you choose before generating a personal plan; zero disables plan generation."

[benchmark]
method = "equal_weight_eligible_universe"
symbol = "SH000300"
note = "The initial backtest uses the configured eligible universe as a transparent peer benchmark when index data is absent."
